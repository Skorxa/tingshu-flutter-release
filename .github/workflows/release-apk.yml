name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, for example 1.1.3. Empty means read from pubspec.yaml.'
        required: false
        type: string
      version_code:
        description: 'Version code. Empty means read from pubspec.yaml build number.'
        required: false
        type: string
      changelog:
        description: 'Release notes written into version.json.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - name: Upgrade Flutter
        run: flutter upgrade

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Prepare Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" || -z "${ANDROID_KEYSTORE_PASSWORD:-}" || -z "${ANDROID_KEY_ALIAS:-}" || -z "${ANDROID_KEY_PASSWORD:-}" ]]; then
            echo "Missing Android signing secrets" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          raw="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          pub_version="${raw%%+*}"
          pub_code="${raw##*+}"
          input_name="${{ github.event.inputs.version_name || '' }}"
          input_code="${{ github.event.inputs.version_code || '' }}"
          version_name="${input_name:-$pub_version}"
          version_code="${input_code:-$pub_code}"
          if [[ -z "$version_name" || -z "$version_code" || "$version_code" == "$raw" ]]; then
            echo "Invalid pubspec version: $raw" >&2
            exit 1
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"
          changelog="${{ github.event.inputs.changelog || '' }}"
          if [[ -z "$changelog" ]]; then
            changelog="自动构建版本 $version_name"
          fi
          {
            echo "changelog<<EOF"
            echo "$changelog"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build arm64 release APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-name "${{ steps.version.outputs.version_name }}" \
            --build-number "${{ steps.version.outputs.version_code }}"

      - name: Prepare release files
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          apk_name="tingshu-${{ steps.version.outputs.version_name }}-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release/$apk_name"
          sha="$(sha256sum "release/$apk_name" | awk '{print $1}')"
          size="$(stat -c%s "release/$apk_name")"
          export SHA256="$sha"
          export APK_SIZE="$size"
          export APK_NAME="$apk_name"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          data = {
              "versionName": os.environ["VERSION_NAME"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "force": False,
              "changelog": os.environ["CHANGELOG"],
              "sha256": os.environ["SHA256"],
              "size": int(os.environ["APK_SIZE"]),
              "publishedAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "urls": [
                  f"https://github.com/Skorxa/tingshu-flutter-release/releases/download/{os.environ['TAG']}/{os.environ['APK_NAME']}"
              ],
          }
          with open("release/version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          TAG: ${{ steps.version.outputs.tag }}
          CHANGELOG: ${{ steps.version.outputs.changelog }}

      - name: Publish release repository files
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_REPO_TOKEN:-}" ]]; then
            echo "Missing secret RELEASE_REPO_TOKEN" >&2
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${RELEASE_REPO_TOKEN}@github.com/Skorxa/tingshu-flutter-release.git" release-repo
          cd release-repo
          git checkout -B main
          mkdir -p apk
          cp ../release/${{ steps.package.outputs.apk_name }} "apk/${{ steps.package.outputs.apk_name }}"
          cp ../release/version.json version.json
          git add apk version.json
          git commit -m "release: ${{ steps.version.outputs.version_name }}" || echo "No release repository changes"
          git push origin main

      - name: Create public GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${{ steps.version.outputs.tag }}" --repo Skorxa/tingshu-flutter-release >/dev/null 2>&1; then
            gh release upload "${{ steps.version.outputs.tag }}" \
              "release/${{ steps.package.outputs.apk_name }}" \
              "release/version.json" \
              --repo Skorxa/tingshu-flutter-release \
              --clobber
            gh release edit "${{ steps.version.outputs.tag }}" \
              --repo Skorxa/tingshu-flutter-release \
              --title "橘听 ${{ steps.version.outputs.version_name }}" \
              --notes "${{ steps.version.outputs.changelog }}"
          else
            gh release create "${{ steps.version.outputs.tag }}" \
              "release/${{ steps.package.outputs.apk_name }}" \
              "release/version.json" \
              --repo Skorxa/tingshu-flutter-release \
              --title "橘听 ${{ steps.version.outputs.version_name }}" \
              --notes "${{ steps.version.outputs.changelog }}"
          fi
